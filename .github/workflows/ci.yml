name: Quality
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  private-release:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_fixture_not_real
      VITE_TURNSTILE_SITE_KEY: fixture-public-site-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:private
      - run: npx playwright install --with-deps chromium
      - run: npm run test:private
      - run: npx playwright test --config playwright.narrative-private.config.ts
      - run: npx playwright test tests/narrative-e2e/compat.spec.ts --config playwright.author.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-release-fixtures
          path: |
            test-results/private-e1
            test-results/narrative-private-e2
            docs/phase-e/e1-captures
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:private
      - run: npm run build
      - run: npm run build:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          ETB_E2E_BUILT: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            test-results
            docs/screenshots
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install test Nginx in disposable CI runner only
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Build private fixture (not a production artifact)
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_fixture_not_real
          VITE_TURNSTILE_SITE_KEY: fixture-public-site-key
        run: npm run build:private && npm run package:vps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:nginx
        env:
          ETB_TEST_ARTIFACT: artifacts/etoilebois-private
      - run: node ops/test-backup-postgres.mjs
      - run: bash -n ops/audit-vps.sh
      - run: bash -n ops/audit-web-details.sh && bash -n ops/cert-renew-hook.sh && bash -n ops/bootstrap-vps.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-verification-fixtures
          path: test-results

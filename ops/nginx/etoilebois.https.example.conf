server {
 listen 80;
 server_name etoilebois.loyaldev.fr;
 location ^~ /.well-known/acme-challenge/ { root /var/www/etoilebois/acme; try_files $uri =404; }
 location / { return 301 https://etoilebois.loyaldev.fr$request_uri; }
}
server {
 listen 443 ssl;
 server_name etoilebois.loyaldev.fr;
 root /var/www/etoilebois/current/site;
 index index.html;
 open_file_cache off;
 ssl_certificate /etc/letsencrypt/live/etoilebois.loyaldev.fr/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/etoilebois.loyaldev.fr/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 access_log /var/log/nginx/etoilebois-access.log;
 error_log /var/log/nginx/etoilebois-error.log;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Referrer-Policy "no-referrer" always;
 add_header X-Frame-Options "DENY" always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://project-ref.supabase.co; media-src 'self' blob: https://project-ref.supabase.co; connect-src 'self' https://project-ref.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
 location = /healthz { access_log off; default_type text/plain; return 200 "etoilebois-static\n"; }
 location ~ /\. { return 404; }
 location ~* ^/(src|supabase|ops|backups|private|media|surprises|demo|node_modules)(/|$) { return 404; }
 location ~* \.(sql|dump|env|map|bak|enc)$ { return 404; }
 location = /build-info.json { return 404; }
 location = /release-manifest.json { return 404; }
 location = /index.html { expires -1; etag off; if_modified_since off; try_files $uri =404; }
 location ~* "^/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.(js|css|woff2?|png|webp)$" { expires 1y; try_files $uri @historic_asset; }
 location /assets/ { expires 5m; try_files $uri =404; }
 location @historic_asset { internal; root /var/www/etoilebois/historic; expires 1y; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
